<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F3B8D0" />
  <meta name="description" content="Koi — a private little space for two." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Koi" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16.png" />
  <link rel="stylesheet" href="style.css" />
  <title>Koi 💗</title>
</head>
<body>
  <div id="app" class="app-shell" data-wallpaper="petals">
    <div class="ambient ambient-pink"></div>
    <div class="ambient ambient-lavender"></div>

    <header class="topbar glass-card">
      <button class="icon-button" id="openPairMenuBtn" aria-label="Pair menu">♡</button>
      <div class="brand-wrap" aria-label="Koi">
        <span class="brand-mark">Koi</span><span class="brand-heart">💗</span>
      </div>
      <button class="icon-button notification-dot" id="openNotificationsBtn" aria-label="Notifications">♢</button>
    </header>

    <main id="mainView" class="main-view" aria-live="polite"></main>

    <nav class="bottom-nav glass-card" aria-label="Main navigation">
      <button class="nav-item is-active" data-route="home" aria-label="Home">
        <span class="nav-icon">⌂</span><span>Home</span>
      </button>
      <button class="nav-item" data-route="us" aria-label="Us">
        <span class="nav-icon">♡</span><span>Us</span>
      </button>
      <button class="nav-item" data-route="memories" aria-label="Memories">
        <span class="nav-icon">▧</span><span>Memories</span>
      </button>
      <button class="nav-item" data-route="extras" aria-label="Extras">
        <span class="nav-icon">✦</span><span>Extras</span>
      </button>
      <button class="nav-item" data-route="you" aria-label="You">
        <span class="nav-icon">◌</span><span>You</span>
      </button>
    </nav>
  </div>

  <!-- Universal sheet/modal -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal-sheet" id="modalSheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <div>
          <p class="eyebrow" id="modalEyebrow"></p>
          <h2 id="modalTitle">Koi</h2>
        </div>
        <button class="icon-button" id="closeModalBtn" aria-label="Close">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </section>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- First-run onboarding -->
  <div class="onboarding" id="onboarding" hidden>
    <div class="onboarding-card glass-card">
      <div class="onboarding-bloom">💗</div>
      <p class="eyebrow">WELCOME TO</p>
      <h1>Koi</h1>
      <p class="lead">A private little space for your little <em>us</em>.</p>

      <div class="onboarding-progress" aria-hidden="true">
        <span class="is-current"></span><span></span><span></span>
      </div>

      <div id="onboardingStep" class="onboarding-step"></div>
      <div class="onboarding-actions">
        <button class="button button-secondary" id="onboardingBackBtn" hidden>Back</button>
        <button class="button button-primary" id="onboardingNextBtn">Continue</button>
      </div>
    </div>
  </div>

  <template id="emptyStateTemplate">
    <div class="empty-state">
      <div class="empty-icon">♡</div>
      <h3>Nothing here yet</h3>
      <p>Your little archive will grow as you use Koi.</p>
    </div>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
